<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="exercicio.css">
    <title>Validação Simples</title>
</head>
<body>

    <div class="container">
        <h2>Validação Simples</h2>

        <div class="caixa">
            <input type="text" placeholder="Digite seu email..." id="email">
            <p id="mensagem"></p>
        </div>

        <div class="caixa">
            <input type="password" placeholder="Digite sua senha..." id="senha">
            <p id="mensagemSenha"></p>
        </div>

        <div class="caixa">
            <button id="validar">Validar</button>
            <p id="mensagemValidar"></p>
        </div>
    </div>

    <script src="exercicio.js"></script>
</body>
</html>
