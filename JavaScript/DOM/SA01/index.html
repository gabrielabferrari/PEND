<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="icon" type="image/png" href="img/favicon-16x16.png">
    <title>Situação de Aprendizagem</title>
</head>
<body>
    <div class="cards"> <!-- Container principal que junta todo o formulário de cadastro -->
        <i id="person" class="bi bi-person-circle"></i>
        <h2>Cadastro de Usuário</h2>

        <div class="card"><!-- Div do campo Nome -->
        <!-- Serve para agrupar o input de nome e a mensagem de validação -->
            <p><i class="bi bi-person"></i> Nome:</p>
            <input type="text" id="nome" placeholder="Digite seu nome...">
            <p id="mensagemNome"></p>
        </div>

        <div class="card"><!-- Div do campo E-mail -->
        <!-- Agrupa o input de e-mail e a mensagem que valida se está correto -->
            <p><i class="bi bi-envelope"></i> E-mail:</p>
            <input type="email" id="email" placeholder="Digite seu email...">
            <p id="mensagemEmail"></p>
        </div>

        <div class="card"><!-- Div do campo Telefone -->
        <!-- Contém o input de telefone, botão para adicionar mais números e mensagens -->
            <p><i class="bi bi-telephone"></i> Telefone (digite apenas números):</p>
            <input type="text" id="telefone" placeholder="(00) 00000-0000" maxlength="15" >
            <button id="addtelefone">+</button>
            <div id="telefones"></div>
            <p id="mensagemTelefone"></p>
        </div>

        <div class="card"><!-- Div do campo Endereço -->
        <!-- Agrupa o input de endereço e sua mensagem de validação -->
            <p><i class="bi bi-geo-alt"></i> Endereço:</p>
            <input type="text" id="endereco" placeholder="Digite seu endereço...">
            <p id="mensagemEndereco"></p>           
        </div>

        <div class="card"><!-- Div do campo Senha -->
        <!-- Contém o input da senha, o ícone de mostrar/ocultar e a mensagem -->
            <p>Senha (pelo menos 6 caracteres):</p>
            <input type="password" id="senha" placeholder="Digite sua senha...">
            <i class="bi bi-eye-fill icone" id="botaoSenha"></i>
            <p id="mensagemSenha"></p>
        </div>

        <div class="card"><!-- Div do campo Confirmar Senha -->
        <!-- Serve para confirmar a senha e mostrar se está igual à original -->
            <input type="password" id="confirmarSenha" placeholder="Confirme sua senha...">
            <i class="bi bi-eye-fill icone" id="botaoConfirmar"></i>
            <p id="mensagemConfirmar"></p>
        </div>
<br>
        <!-- Botão que envia o formulário. Quando clicado, ele verifica se todos os campos estão corretos e realiza o cadastro -->
        <button id="cadastrar">Cadastrar<i class="bi bi-send"></i></button>
        <p id="mensagemCadastrar"></p>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
